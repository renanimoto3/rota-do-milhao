<style>

.banner b{color:var(--gold2)}.banner button{border:0;background:var(--grad);color:#1a1405;font-weight:800;font-size:12px;padding:8px 10px;border-radius:9px;white-space:nowrap}

input[type=range]{padding:0;height:6px;-webkit-appearance:none;background:#2a2a31;border:0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--grad)}

.plan .rib{position:absolute;top:-10px;left:14px;background:var(--grad);color:#1a1405;font-size:10px;font-weight:800;letter-spacing:.1em;padding:4px 9px;border-radius:7px;text-transform:uppercase}
.plan .pr{font-family:"Playfair Display",serif;font-size:36px;color:var(--gold2)}.plan .pr s{font-size:16px;color:var(--mut);margin-right:6px}.plan .pr small{font-size:13px;color:var(--mut);font-family:Inter}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9999}.ovl.on{display:flex}.ovl .m{background:var(--card);border:1px solid var(--gold3);border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:88dvh;overflow:auto}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(9,9,11,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
.nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px}.nav button span{font-size:20px}.nav button.on{color:var(--gold2)}
.tiny{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.welcome{background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.05));border:1px solid var(--gold3);border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;display:none}.welcome.on{display:block}
.streak{display:flex;gap:6px;margin:8px 0}.streak i{flex:1;height:8px;border-radius:4px;background:#1c1c22}.streak i.on{background:var(--grad)}
</style></head>

<script>
const IMG='https://cdn.jsdelivr.net/gh/renanimoto3/rota-do-milhao@main/img/';const CFG=JSON.parse(document.getElementById('cfg').textContent);const $=s=>document.querySelector(s);
const BRL=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
let M={member:false,products:[]},P={};try{P=JSON.parse(localStorage.getItem('rm_prog')||'{}');M=JSON.parse(localStorage.getItem('rm_member')||'{"member":false,"products":[]}')}catch(e){}

const track=()=>{try{return JSON.parse(localStorage.getItem('rm_track')||'{}')}catch(e){return{}}};
function ck(url){const t=track();const q=new URLSearchParams();['src','utm_source','utm_medium','utm_campaign','utm_content','fbclid','sck'].forEach(k=>{if(t[k])q.set(k,t[k])});if(!q.get('utm_source'))q.set('utm_source',t.src||'direto');const em=localStorage.getItem('rm_email');if(em)q.set('email',em);return url+(url.includes('?')?'&':'?')+q.toString()}

/* ===== CONTEÚDO ===== */
const F1=[
{id:'s1',free:true,ic:'✍️',t:'Serviço 1: Legendas para negócios locais',s:'Pacote de 10 legendas · R$ 80 a 150',price:'R$ 80 a 150 por pacote',intro:'Toda padaria, pizzaria, salão e loja de bairro posta no Instagram e não sabe o que escrever. Você entrega 10 legendas prontas em 20 minutos usando o prompt abaixo.',
 steps:['Escolha 1 negócio que você já conhece (pode ser o da esquina). Abra o Instagram dele e anote: o que vende, o tom (sério ou descontraído) e 3 produtos principais.','Abra o ChatGPT (grátis) e cole o prompt abaixo preenchendo os colchetes.','Leia as 10 legendas. Troque 1 ou 2 palavras para ficar com a cara do negócio. Isso é o seu "toque humano" e é o que justifica o preço.','Monte a entrega em uma nota do celular ou no WhatsApp: título "10 legendas prontas para o seu Instagram" e as legendas numeradas.','Mande a mensagem de oferta (está na aula "Primeiro cliente em 48h") para 5 negócios hoje. 1 em 5 responde.'],
 prompt:'Você é um copywriter especialista em negócios locais no Brasil. Escreva 10 legendas curtas para o Instagram de [TIPO DE NEGÓCIO] chamado [NOME], que vende [3 PRODUTOS PRINCIPAIS], em tom [DESCONTRAÍDO/ELEGANTE]. Regras: cada legenda com no máximo 3 linhas, 1 chamada para ação no fim (ex.: "chama no direct"), 2 a 3 emojis no máximo, 3 hashtags locais de [CIDADE/BAIRRO]. Varie: 3 de oferta, 3 de bastidor, 2 de prova social, 2 de curiosidade.'},
{id:'s2',free:true,ic:'🎨',t:'Serviço 2: Artes para Instagram com IA',s:'3 artes · R$ 90 a 150',price:'R$ 90 a 150 por pacote',intro:'Feed bonito vende. Você gera as imagens no ChatGPT e monta o post no Canva gratuito, direto do celular.',
 steps:['No ChatGPT, gere 3 imagens com o prompt abaixo (uma por produto). Peça "sem texto na imagem".','Abra o Canva (grátis no celular), modelo "Post Instagram 1080x1080". Suba a imagem gerada como fundo.','Coloque o nome do produto, o preço e o @ do negócio. Use só 1 fonte e as cores do logo dele.','Exporte as 3 em PNG. Mande como prévia com marca d\'água "AMOSTRA" para o cliente aprovar antes de pagar.','Entrega paga: as 3 sem marca d\'água + 1 bônus (story). Cobre 50% antes e 50% na entrega.'],
 prompt:'Crie uma única imagem fotorrealista, quadrada, de [PRODUTO] de uma [TIPO DE NEGÓCIO], em um cenário [ELEGANTE/ACONCHEGANTE], iluminação de estúdio suave, fundo levemente desfocado, cores [COR PRINCIPAL DA MARCA]. Sem texto, sem logo, sem marca d\'água.'},
{id:'s3',free:true,ic:'📣',t:'Serviço 3: Texto de anúncio que vende',s:'1 campanha pronta · R$ 100 a 150',price:'R$ 100 a 150 por campanha',intro:'Negócios locais impulsionam post sem saber escrever anúncio e perdem dinheiro. Você entrega o texto certo em 10 minutos.',
 steps:['Pergunte ao dono: qual produto quer vender mais, qual a promoção e para quem (bairro, idade).','Cole o prompt abaixo no ChatGPT com essas respostas.','Escolha as 2 melhores versões e entregue com a instrução: "impulsione por 7 dias, R$ 10 por dia, público do bairro".','Depois de 7 dias, pergunte quantas mensagens chegaram. Esse número vira seu depoimento para o próximo cliente.'],
 prompt:'Escreva 3 versões de texto de anúncio para Instagram/Facebook de [NEGÓCIO] em [CIDADE] vendendo [PRODUTO/PROMOÇÃO] para [PÚBLICO]. Estrutura: gancho de 1 linha que fala da dor ou do desejo, 2 linhas de oferta clara com preço, 1 linha de urgência real (prazo ou quantidade), chamada "Chama no WhatsApp". Máximo 5 linhas cada. Sem promessas exageradas.'},
{id:'a1',free:true,ic:'🤝',t:'Aula: Primeiro cliente em 48h (de graça)',s:'onde achar e o que dizer',price:'',intro:'Cliente não aparece. Cliente é abordado. Em 48 horas, com 5 mensagens por dia, você fecha o primeiro.',
 steps:['Onde achar: Instagram (busque "[sua cidade] + padaria/salão/pizzaria" e abra perfis com menos de 2 mil seguidores e posts fracos), grupos de Facebook do bairro, WhatsApp de comércio local e o Google Maps (negócios com poucas fotos).','O que dizer (copie): "Oi, [nome]! Vi o Instagram da [negócio] e tive uma ideia: fiz 3 legendas de amostra para vocês, de graça, para ver se gosta. Posso mandar aqui?"','Mande as 3 amostras feitas com o Serviço 1. Depois: "Se curtiu, faço o pacote com 10 por R$ 97, pronto em 24h. Fecho?"','Regra de ouro: 5 abordagens por dia, todo dia, por 7 dias. É matemática: 35 abordagens, 5 a 7 respondem, 1 a 2 fecham.','Recebeu? Pede um áudio ou print de "gostei". Esse é o seu primeiro depoimento. Guarde.'],prompt:''},
{id:'s4',free:false,ic:'🔒',t:'Serviços 4 a 37 com IA',s:'tradução, currículos, cardápios, edição de vídeo…',price:''},
{id:'b1',free:false,ic:'🗺️',t:'Mapa dos 37 Serviços',s:'bônus · o que fazer, para quem e quanto cobrar',price:''},
{id:'b3',free:false,ic:'💰',t:'Tabela de Preços 2026',s:'bônus · nunca mais cobrar barato',price:''},
{id:'b4',free:false,ic:'💬',t:'Scripts de Cobrança e Fechamento',s:'bônus · a mensagem que fecha e recebe',price:''}];
const F2=[{id:'f2',free:false,ic:'🔁',t:'Fase 2: Renda Fixa em 60 dias',s:'3 a 5 clientes fixos, pacotes mensais',price:''},{id:'f2b',free:false,ic:'📱',t:'Social media para negócios locais',s:'pacote mensal R$ 400 a 900',price:''},{id:'f2c',free:false,ic:'💼',t:'Gestão de WhatsApp e produtos digitais',s:'renda que repete',price:''}];
const F3=[{id:'f3',free:false,up:'up1',ic:'📈',t:'Fase 3: Multiplicação (Investidor de Bolso)',s:'reserva, renda fixa, FIIs e ações pelo celular',price:''},{id:'f4',free:false,up:'up1',ic:'🏆',t:'Fase 4: Rota do Milhão',s:'simulador do milhão, escalar em agência, múltiplas fontes',price:''},{id:'d7',free:false,up:'up2',ic:'🔥',t:'Desafio 7 Dias com IA',s:'missões diárias + scripts de prospecção',price:''},{id:'cl',free:false,up:'clube',ic:'👑',t:'Clube da Rota',s:'aula nova toda semana, novos serviços, comunidade',price:''}];

function open(id){const m=[...F1,...F2,...F3].find(x=>x.id===id);if(!m||!unlocked(m))return pitch(m&&m.up);

 document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$('#v_mod').classList.add('on');window.scrollTo(0,0)}

function calc(){const st=(()=>{try{return JSON.parse(localStorage.getItem('rm_state')||'{}')}catch(e){return{}}})();const base=st.hi||2500;
 $('#v_calc').innerHTML=`<h1>Calculadora da Rota</h1><p class="sub">Mexa nos números e veja sua rota mudar.</p>

 $('#ovl').classList.add('on');document.body.style.overflow='hidden'}
